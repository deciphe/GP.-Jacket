<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake payouts? Every Vest withdrawal, on-chain</title>
<meta name="description" content="Every USDC withdrawal paid out by Vest's contracts on Base, Arbitrum and Ethereum since Sep 20, 2026. Each one links to its transaction.">
<meta property="og:title" content="Fake payouts? Count them.">
<meta property="og:description" content="Every USDC withdrawal Vest has paid out since Sep 20, 2026. All on-chain. Check any of them.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Geist:wght@500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b;--cr:#e6e3dc;--ink2:#c3c0b9;--mute:#8a877f;--faint:#4f4d48;--line:rgba(238,234,226,.08);--line2:rgba(238,234,226,.14);
  --mint:#9fd7b2;--mint2:#bfe6cb;--card:#131312;
  --disp:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --sans:"Geist","Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pad:clamp(16px,3.6vw,68px);--rh:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--cr);font:500 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--cr);color:var(--bg)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px}

/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(28px,5vw,72px) var(--pad) clamp(28px,4vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(20px,4vw,72px);align-items:end}
.kick{font:600 clamp(22px,2.6vw,44px)/1 var(--disp);letter-spacing:-.05em;color:var(--mute)}
.big{margin:.12em 0 0 -.04em;font:700 clamp(54px,11.4vw,230px)/.82 var(--disp);letter-spacing:-.075em;white-space:nowrap;font-variant-numeric:tabular-nums}
.big i{font-style:normal;color:var(--faint)}
.sub{margin-top:clamp(18px,2vw,34px);max-width:44ch;font:600 clamp(17px,1.5vw,24px)/1.25 var(--disp);letter-spacing:-.03em;color:var(--ink2)}
.sub b{font-weight:600;color:var(--cr)}

/* the stack: Vest on top, the other logo underneath */
.mog{position:relative;width:clamp(150px,22vw,360px);padding-bottom:6%;justify-self:end}
.mog .vest{position:relative;z-index:2;display:block;width:100%;height:auto;filter:drop-shadow(0 0 46px rgba(159,215,178,.34)) drop-shadow(0 26px 22px rgba(0,0,0,.85));animation:bob 5s ease-in-out infinite}
.mog .cft{position:absolute;z-index:1;left:50%;bottom:0;width:46%;border-radius:6px;transform:translateX(-50%) perspective(300px) rotateX(58deg) scaleY(.8);transform-origin:50% 100%;filter:grayscale(1) brightness(.55) contrast(.9);opacity:.8}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- controls ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px var(--pad);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);font:600 13px var(--sans);color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip small{font:500 11px var(--mono);color:var(--mute)}
.chip:hover{border-color:rgba(238,234,226,.3)}
.chip[aria-pressed=true]{background:var(--cr);color:var(--bg);border-color:var(--cr)}
.chip[aria-pressed=true] small{color:rgba(11,11,11,.6)}
.dot{width:7px;height:7px;border-radius:50%}
.sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.find{flex:1 1 210px;min-width:150px;height:36px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--cr);padding:0 13px;font:500 13px var(--mono)}
.find::placeholder{color:var(--mute)}
.tally{margin-left:auto;font:500 12px var(--mono);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.tally b{font-weight:600;color:var(--mint)}

/* ---------- the list ---------- */
.head,.row{display:grid;grid-template-columns:168px 104px minmax(0,1fr) 170px 40px;align-items:center;gap:0 18px;padding:0 var(--pad)}
.head{height:36px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.head span:nth-child(4){text-align:right}
#list{position:relative;contain:layout}
.row{position:absolute;left:0;right:0;height:var(--rh);border-bottom:1px solid var(--line)}
.row:hover{background:rgba(238,234,226,.03)}
.t{font:500 13px var(--mono);color:var(--ink2);white-space:nowrap}
.t em{font-style:normal;color:var(--mute)}
.ch{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--sans);color:var(--ink2)}
.w{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px var(--mono);color:var(--ink2);padding:4px 0}
.w:hover{color:var(--cr);text-decoration:underline;text-underline-offset:3px}
.a{text-align:right;font:600 15px var(--mono);letter-spacing:-.02em;color:var(--mint);white-space:nowrap;font-variant-numeric:tabular-nums}
.a.s{color:var(--ink2)}
.a.l{color:var(--mint2);font-size:17px}
.x{justify-self:end;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line2);color:var(--mute);font-size:14px}
.x:hover{color:var(--bg);background:var(--cr);border-color:var(--cr)}
.sk{height:10px;border-radius:5px;background:rgba(238,234,226,.07)}
.none{padding:60px var(--pad);color:var(--mute);font:600 20px var(--disp);letter-spacing:-.03em}
footer{padding:28px var(--pad) 60px;border-top:1px solid var(--line);color:var(--mute);font:500 12px/1.6 var(--sans);max-width:110ch}
footer a{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
footer code{font:500 11px var(--mono);word-break:break-all}

@media (max-width:820px){
  :root{--rh:62px}
  .hero{grid-template-columns:1fr;align-items:start}
  .mog{grid-row:1;justify-self:start;width:132px}
  .head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto 34px;grid-template-rows:auto auto;gap:3px 12px;align-content:center}
  .t{grid-column:1;grid-row:2;font-size:11px;color:var(--mute)}
  .ch{display:none}
  .w{grid-column:1;grid-row:1}
  .a{grid-column:2;grid-row:1/3}
  .x{grid-column:3;grid-row:1/3}
  .tally{width:100%;margin:0}
  .sep{display:none}
}
@media (prefers-reduced-motion:reduce){.mog .vest{animation:none}}
</style>
</head>
<body>
<header class="hero">
  <div>
    <p class="kick">Fake payouts?</p>
    <h1 class="big" id="big" aria-label="Total paid out">$0</h1>
    <p class="sub"><b id="cnt">…</b> USDC withdrawals paid out by Vest to <b id="wal">…</b> wallets since Sep 20. Every one is on-chain. Open any of them.</p>
  </div>
  <div class="mog" aria-hidden="true">
    <svg class="vest" viewBox="-20 -30 589 400" aria-hidden="true"><defs><linearGradient id="vg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eafaf0" stop-opacity=".95"/><stop offset="1" stop-color="#9fd7b2" stop-opacity=".7"/></linearGradient><linearGradient id="vg2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf0" stop-opacity=".85"/><stop offset="1" stop-color="#9fd7b2" stop-opacity=".5"/></linearGradient><linearGradient id="vg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6cb" stop-opacity=".35"/><stop offset="1" stop-color="#9fd7b2" stop-opacity=".12"/></linearGradient></defs><path d="M130.463 1.64132L2.10114 104.296C0.259255 105.778 0.259255 108.571 2.10114 110.032L136.429 217.472V4.52427C136.429 1.43111 132.865 -0.260628 130.453 1.64132H130.463Z" fill="url(#vg1)"/><path d="M546.559 104.307L418.198 1.6418C415.785 -0.290179 412.222 1.43159 412.222 4.52475V217.483L546.559 110.043C548.401 108.561 548.401 105.768 546.559 104.307Z" fill="url(#vg2)"/><path d="M272.038 325.934L136.429 217.482V335.143C136.429 337.165 138.06 338.827 140.112 338.827H408.597C410.62 338.827 412.281 337.195 412.281 335.143V217.482L276.672 325.934C275.331 327.005 273.439 327.005 272.068 325.934H272.038Z" fill="url(#vg3)" stroke="#bfe6cb" stroke-opacity=".35" stroke-width="6"/></svg>
    <img class="cft" src="cft.jpg" alt="" width="262" height="108">
  </div>
</header>

<div class="bar" id="bar">
  <span id="chains" style="display:contents"></span>
  <span class="sep"></span>
  <span id="mins" style="display:contents"></span>
  <input class="find" id="find" type="search" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Find a wallet 0x…" aria-label="Find a wallet address">
  <span class="tally" id="tally" aria-live="polite"></span>
</div>
<div class="head"><span>Time</span><span>Chain</span><span>Paid to</span><span>Amount</span><span></span></div>
<main id="list" aria-label="Withdrawals, newest first"></main>
<footer id="foot"></footer>

<script>
(function(){
'use strict';
var CH=[
  {k:'Base',c:'#5b8def',tx:'https://basescan.org/tx/0x',ad:'https://basescan.org/address/0x55133c825603e6a5b9e911abab23e75dc3bb07af'},
  {k:'Arbitrum',c:'#4fc3e8',tx:'https://arbiscan.io/tx/0x',ad:'https://arbiscan.io/address/0xb2f86eae1197032fa85389cc6c0f3b06b58dd1ea'},
  {k:'Ethereum',c:'#b9b6ff',tx:'https://etherscan.io/tx/0x',ad:'https://etherscan.io/address/0xe80f92077131b9890599e418ae323de71ce1c35a'}
];
var MINS=[0,1000,10000,100000],REC=64,HEX=[];
for(var i=0;i<256;i++)HEX.push((i<16?'0':'')+i.toString(16));
var $=function(id){return document.getElementById(id)};
var list=$('list'),meta=null,chunks=[],pending={},loaded=0;
var f={chain:-1,min:0,q:''},view=null,vsum=0,RH=52;
var usd0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),usd2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
var dfmt=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}),tfmt=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});

function hex(u8,o,n){var s='';for(var i=0;i<n;i++)s+=HEX[u8[o+i]];return s}
function amt(c,o){return (c.dv.getUint32(o+4,true)+c.dv.getUint16(o+8,true)*4294967296)/1e6}
function short(n){return n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4||n%1e3===0?0:1)+'k':String(n)}

function load(n){
  if(chunks[n]||pending[n])return pending[n];
  return pending[n]=fetch('p'+n+'.bin').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){
    chunks[n]={dv:new DataView(b),u8:new Uint8Array(b),n:b.byteLength/REC};loaded++;delete pending[n];
    if(filtered())build();else draw(true);
    tally();
  }).catch(function(){delete pending[n];setTimeout(function(){load(n)},1500)});
}
function loadAll(par){var n=0;function next(){while(n<meta.chunks&&(chunks[n]||pending[n]))n++;if(n>=meta.chunks)return;var p=load(n++);p&&p.then(next)}for(var i=0;i<par;i++)next()}
function filtered(){return f.chain>=0||f.min>0||f.q!==''}

function build(){
  if(!filtered()){view=null;vsum=0;size();draw(true);return}
  var out=[],sum=0,q=f.q,minU=f.min;
  for(var n=0;n<meta.chunks;n++){var c=chunks[n];if(!c)continue;
    for(var r=0;r<c.n;r++){var o=r*REC;
      if(f.chain>=0&&c.u8[o+10]!==f.chain)continue;
      var a=amt(c,o);if(a<minU)continue;
      if(q&&hex(c.u8,o+12,20).indexOf(q)<0)continue;
      out.push(n*meta.chunk+r);sum+=a}}
  view=out;vsum=sum;size();draw(true);
}
function size(){var n=view?view.length:meta.count;list.style.height=(n*RH)+'px';
  if(view&&!n&&loaded===meta.chunks){list.style.height='auto';list.innerHTML='<p class="none">Nothing matches. Clear the filters to see all '+usd0.format(meta.count)+'.</p>'}}
function tally(){
  var t=$('tally'),part=loaded<meta.chunks;
  if(filtered())t.innerHTML='<b>'+usd0.format(view?view.length:0)+'</b> shown · <b>$'+usd0.format(vsum)+'</b>'+(part?' · loading '+Math.round(loaded/meta.chunks*100)+'%':'');
  else t.innerHTML=part?'loading '+Math.round(loaded/meta.chunks*100)+'%':'<b>'+usd0.format(meta.count)+'</b> withdrawals · newest first';
}

var lastA=-1,lastB=-1;
function draw(force){
  if(!meta)return;
  var n=view?view.length:meta.count;if(!n)return;
  var top=list.getBoundingClientRect().top,vh=window.innerHeight;
  var a=Math.max(0,Math.floor(-top/RH)-8),b=Math.min(n,Math.ceil((vh-top)/RH)+8);
  if(b<=a){a=Math.max(0,Math.min(a,n-1));b=a}
  if(!force&&a===lastA&&b===lastB)return;lastA=a;lastB=b;
  var h='',now=Date.now()/1000;
  for(var i=a;i<b;i++){
    var g=view?view[i]:i,cn=Math.floor(g/meta.chunk),c=chunks[cn],y='style="transform:translateY('+(i*RH)+'px)"';
    if(!c){load(cn);h+='<div class="row" '+y+'><span class="sk" style="width:110px"></span><span class="sk ch" style="width:60px"></span><span class="sk" style="width:60%"></span><span class="sk" style="width:90px;justify-self:end"></span><span></span></div>';continue}
    var o=(g-cn*meta.chunk)*REC,ts=c.dv.getUint32(o,true),am=amt(c,o),ci=c.u8[o+10],ad=hex(c.u8,o+12,20),tx=hex(c.u8,o+32,32),d=new Date(ts*1000);
    h+='<div class="row" '+y+'><span class="t">'+dfmt.format(d)+' <em>'+tfmt.format(d)+'</em></span>'+
      '<span class="ch"><i class="dot" style="background:'+CH[ci].c+'"></i>'+CH[ci].k+'</span>'+
      '<button class="w" data-w="'+ad+'" title="Show every withdrawal to this wallet">0x'+ad+'</button>'+
      '<span class="a'+(am<100?' s':am>=10000?' l':'')+'">$'+usd2.format(am)+'</span>'+
      '<a class="x" href="'+CH[ci].tx+tx+'" target="_blank" rel="noopener" aria-label="Open transaction on '+CH[ci].k+' explorer">↗</a></div>';
  }
  list.innerHTML=h;
}
var raf=0;function sched(){if(!raf)raf=requestAnimationFrame(function(){raf=0;draw(false)})}
addEventListener('scroll',sched,{passive:true});
addEventListener('resize',function(){var r=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh'))||52;if(r!==RH){RH=r;if(meta)size()}draw(true)});

function setF(){
  var b=$('bar').querySelectorAll('.chip');
  for(var i=0;i<b.length;i++){var e=b[i];e.setAttribute('aria-pressed',e.dataset.c!==undefined?String(+e.dataset.c===f.chain):String(+e.dataset.m===f.min))}
  if(filtered())loadAll(4);
  build();tally();
  var top=list.getBoundingClientRect().top;if(top<0)scrollBy(0,top-$('bar').offsetHeight-36);
}
function ui(){
  var h='<button class="chip" data-c="-1">All chains</button>';
  CH.forEach(function(c,i){h+='<button class="chip" data-c="'+i+'"><i class="dot" style="background:'+c.c+'"></i>'+c.k+' <small>$'+short(meta.chains[i].usd)+'</small></button>'});
  $('chains').innerHTML=h;
  h='';MINS.forEach(function(m){h+='<button class="chip" data-m="'+m+'">'+(m?'$'+short(m)+'+':'Any size')+'</button>'});
  $('mins').innerHTML=h;
  $('bar').addEventListener('click',function(e){var t=e.target.closest('.chip');if(!t)return;
    if(t.dataset.c!==undefined)f.chain=+t.dataset.c;else f.min=+t.dataset.m;setF()});
  var tm=0;$('find').addEventListener('input',function(){clearTimeout(tm);var v=this.value;tm=setTimeout(function(){
    f.q=v.trim().toLowerCase().replace(/^0x/,'').replace(/[^0-9a-f]/g,'');setF()},180)});
  list.addEventListener('click',function(e){var t=e.target.closest('.w');if(!t)return;
    var same=f.q===t.dataset.w;f.q=same?'':t.dataset.w;$('find').value=same?'':'0x'+t.dataset.w;setF()});
  $('cnt').textContent=usd0.format(meta.count);$('wal').textContent=usd0.format(meta.wallets);
  var D=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
  $('foot').innerHTML='Source: USDC <code>Transfer</code> logs sent by Vest\'s deposit contracts through their <code>Withdraw</code> call, '+
    CH.map(function(c){return '<a href="'+c.ad+'" target="_blank" rel="noopener">'+c.k+'</a>'}).join(', ')+
    '. This is every withdrawal: funded payouts and regular account withdrawals look the same on-chain. Internal bridge transfers are left out. '+
    'Snapshot from Sep 20, 2026 to '+D.format(new Date(meta.to*1000))+'. Independent page, not made or endorsed by Vest Markets or Crypto Fund Trader.';
  var big=$('big'),end=meta.usd,t0=0,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function put(v){big.innerHTML='<i>$</i>'+usd0.format(v)}
  if(still)put(end);else requestAnimationFrame(function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-p,4);put(end*e);if(p<1)requestAnimationFrame(step)});
}

fetch('meta.json').then(function(r){return r.json()}).then(function(m){
  meta=m;RH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh'))||52;
  ui();setF2();size();tally();draw(true);
  load(0).then(function(){loadAll(2)});
});
function setF2(){var b=$('bar').querySelectorAll('.chip');for(var i=0;i<b.length;i++){var e=b[i];e.setAttribute('aria-pressed',e.dataset.c!==undefined?String(+e.dataset.c===f.chain):String(+e.dataset.m===f.min))}}
})();
</script>
</body>
</html>
