<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIGAPROP.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--cr:#e6e3dc;--dim:#8a877f;--mute:#4a4843;--mint:#9fd7b2;--rose:#e8988c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--cr);font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top,.bot{position:absolute;left:clamp(16px,3.4vw,66px);right:clamp(16px,3.4vw,66px);display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:clamp(10px,.9vw,15px);font-weight:600;letter-spacing:.2em;color:#6f6c66;text-transform:uppercase}
.top{top:clamp(20px,3.6vw,64px)}.bot{bottom:clamp(20px,3.6vw,64px)}
.top b{color:var(--cr);letter-spacing:-.02em;text-transform:none;font-size:1.35em;font-weight:700}
.bot a:hover{color:var(--cr)}
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.moonc{animation:breathe 11s ease-in-out infinite;-webkit-mask-image:linear-gradient(115deg,rgba(0,0,0,.6) 35%,#000 50%,rgba(0,0,0,.6) 65%);mask-image:linear-gradient(115deg,rgba(0,0,0,.6) 35%,#000 50%,rgba(0,0,0,.6) 65%);-webkit-mask-size:320% 100%;mask-size:320% 100%}
@keyframes breathe{0%,100%{opacity:.8;-webkit-mask-position:100% 0;mask-position:100% 0}50%{opacity:1;-webkit-mask-position:0 0;mask-position:0 0}}
.hw{position:absolute;left:0;right:0;top:var(--wy,30%);text-align:center;font-weight:700;letter-spacing:-.055em;line-height:1;z-index:2}
.hw span{color:var(--cr)}.hw i{font-style:normal;color:#4a4843}
.hw.r span{color:var(--rose)}
.hw.r{transform:scaleY(-1);opacity:.13;-webkit-mask-image:linear-gradient(0deg,#000 0,transparent 70%);mask-image:linear-gradient(0deg,#000 0,transparent 70%);filter:blur(.6px);pointer-events:none}
.ln{position:absolute;left:0;right:0;text-align:center;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px}
.ln p{font-size:clamp(16px,1.35vw,24px);font-weight:600;color:#8a877f;letter-spacing:-.01em}.ln p b{color:var(--cr);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:12px;height:54px;padding:0 28px;border-radius:12px;background:var(--cr);color:#0b0b0b;font-weight:700;font-size:15px;letter-spacing:-.01em;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(230,227,220,.15)}
.ln small{font-size:12px;font-weight:600;color:#4a4843;letter-spacing:.06em}.ln small a{color:#8a877f}
.hw{top:auto}.soon{position:absolute;left:0;right:0;text-align:center;z-index:2;font-size:clamp(11px,.95vw,15px);font-weight:600;letter-spacing:.3em;color:#6f6c66;text-transform:uppercase}
</style></head><body>
<section class="hero" id="hero"><canvas class="moonc" id="mc"></canvas><canvas id="fx"></canvas>
<div class="top"><b>GP.</b><span>gigaprop.xyz</span></div>
<div class="hw" id="w1"><span>GIGAPROP</span><i>.</i></div>
<div class="soon" id="sn">in the works</div>
<div class="bot"><span>for vest</span><span>soon</span></div>
</section>
<script>
(() => {
  const H = document.getElementById('hero'), mc = document.getElementById('mc'), fx = document.getElementById('fx'), w1 = document.getElementById('w1'), sn = document.getElementById('sn');
  function moon(x, cx, cy, R, step, hz, flip, tint, alpha, u) {
    for (let yy = -R; yy <= R; yy += step) for (let xx = -R; xx <= R; xx += step) { if (Math.hypot(xx, yy) > R) continue;
      const lx = (xx + R * .34) / R, ly = (yy + R * .42) / R, lit = Math.max(0, 1 - Math.hypot(lx, ly) * .72), cr = Math.sin(xx * .021 / u) * Math.cos(yy * .017 / u) * .18 + Math.sin((xx + yy) * .009 / u) * .12;
      const v = Math.max(0, Math.min(1, lit + cr * lit)), r = step * .42 * Math.pow(v, 1.1); if (r < .35) continue;
      const py = flip ? 2 * hz - (cy + yy) : cy + yy; if (!flip && py > hz - 2 * u) continue; if (flip && py < hz + 2 * u) continue;
      const fade = flip ? Math.max(0, 1 - (py - hz) / (R * 1.1)) : 1; x.fillStyle = `rgba(${tint},${(alpha * (.35 + .65 * v) * fade).toFixed(3)})`; x.beginPath(); x.arc(cx + xx, py, r, 0, 7); x.fill(); } }
  function draw() {
    const W = H.clientWidth, Ht = H.clientHeight, d = Math.min(2, devicePixelRatio || 1), wide = W / Ht > 1.2, u0 = Math.min(W, Ht) / 1080, hz = Ht * (wide ? .56 : .52);
    const fs = Math.round((wide ? 150 : 170) * u0 * (W < 700 ? .55 : 1)); w1.style.fontSize = fs + 'px'; w1.style.top = (hz - fs * 1.35) + 'px'; sn.style.top = (hz + 36 * Math.max(.7, u0)) + 'px';
    [mc, fx].forEach(c => { c.width = W * d; c.height = Ht * d; });
    const m = mc.getContext('2d'); m.setTransform(d, 0, 0, d, 0, 0); const Rm = (wide ? 430 : 360) * u0, stp = Math.max(6, 8 * u0); moon(m, W * (wide ? .72 : .66), hz - Rm * .38, Rm, stp, hz, false, '230,227,220', .36, u0);
    const x = fx.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const gh = x.createLinearGradient(0, 0, W, 0); gh.addColorStop(0, 'rgba(230,227,220,0)'); gh.addColorStop(.5, 'rgba(230,227,220,.32)'); gh.addColorStop(1, 'rgba(230,227,220,0)'); x.fillStyle = gh; x.fillRect(0, hz - .6, W, 1.2);
    for (let i = 0; i < 240; i++) { x.fillStyle = 'rgba(230,227,220,' + (rnd() * .16).toFixed(3) + ')'; x.beginPath(); x.arc(rnd() * W, rnd() * Ht, rnd() * 1.2 + .3, 0, 7); x.fill(); }
    const vg = x.createRadialGradient(W * .55, hz, Math.min(W, Ht) * .25, W * .5, hz, Math.max(W, Ht) * .85); vg.addColorStop(0, 'rgba(11,11,11,0)'); vg.addColorStop(1, 'rgba(11,11,11,.85)'); x.fillStyle = vg; x.fillRect(0, 0, W, Ht);
  }
  let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 120); }); (document.fonts ? document.fonts.ready : Promise.resolve()).then(draw); draw();
})();
</script></body></html>
