<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP. Entry</title>
<meta name="description" content="GP. Entry for Vest. Risk-locked one-click ticket, trade managed from the chart, desk, copier, Zone.">
<meta property="og:title" content="GP. Entry"><meta property="og:image" content="https://gigaprop.xyz/s/target.jpg"><meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--cr:#e6e3dc;--dim:#8a877f;--mute:#4a4843;--mint:#9fd7b2;--rose:#e8988c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--cr);font-family:Manrope,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(16px,4vw,48px);z-index:9;mix-blend-mode:difference}
.top b{font-size:17px;font-weight:800;letter-spacing:-.03em}.top b i{font-style:normal;color:#5a5852}
.top span{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,6vw,96px);overflow:hidden}
.moon{position:absolute;right:-12vmin;top:6vmin;width:78vmin;height:78vmin;border-radius:50%;background:radial-gradient(circle,rgba(230,227,220,.34) 1.3px,transparent 1.9px) 0 0/9px 9px;-webkit-mask:radial-gradient(circle at 34% 32%,#000 0,rgba(0,0,0,.65) 40%,rgba(0,0,0,.12) 64%,transparent 71%);mask:radial-gradient(circle at 34% 32%,#000 0,rgba(0,0,0,.65) 40%,rgba(0,0,0,.12) 64%,transparent 71%);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-2vmin,1.5vmin) rotate(4deg)}}
.hz{position:absolute;left:0;right:0;bottom:22vh;height:1px;background:linear-gradient(90deg,transparent,rgba(230,227,220,.3),transparent)}
h1{position:relative;font-size:clamp(76px,17vw,250px);font-weight:800;letter-spacing:-.065em;line-height:.86}
h1 i{font-style:normal;color:#3a3935}
.sub{position:relative;margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:clamp(14px,1.4vw,17px);font-weight:700;color:var(--dim)}
.sub b{color:var(--cr)}
.cta{position:relative;margin-top:44px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.btn{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 30px;border-radius:14px;background:var(--mint);color:#0b0b0b;font-weight:800;font-size:16px;letter-spacing:-.01em;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(159,215,178,.25)}
.cta small{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}.cta small a{color:var(--dim);border-bottom:1px solid #2a2927}
.scroll{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.3em;color:var(--mute)}
/* the stills */
.show{position:relative;padding:12vh 0 8vh}
.stage{position:relative;width:min(1400px,94vw);margin:0 auto;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 0 0 1px rgba(230,227,220,.1),0 60px 140px rgba(0,0,0,.8)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.035);transition:opacity .9s ease,transform 6s ease-out}
.stage img.on{opacity:1;transform:scale(1)}
.cap{width:min(1400px,94vw);margin:34px auto 0;display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}
.cap h2{font-size:clamp(52px,9vw,128px);font-weight:800;letter-spacing:-.06em;line-height:.9;transition:opacity .4s}
.cap h2 em{font-style:normal;color:var(--mint)}
.cap p{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-top:12px}
.nav{display:flex;align-items:center;gap:10px}
.nav button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(230,227,220,.18);font-size:18px;color:var(--cr);transition:background .2s}
.nav button:hover{background:rgba(230,227,220,.08)}
.nav span{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--dim);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.bar{width:min(1400px,94vw);margin:26px auto 0;display:flex;gap:4px}
.bar i{flex:1;height:3px;border-radius:2px;background:rgba(230,227,220,.1);overflow:hidden;cursor:pointer}
.bar i b{display:block;height:100%;width:0;background:var(--cr)}
.bar i.done b{width:100%;background:#5a5852}
.bar i.on b{animation:fill var(--t) linear forwards}
@keyframes fill{to{width:100%}}
.paused .bar i.on b{animation-play-state:paused}
.foot{padding:16vh clamp(16px,6vw,96px) 10vh;display:grid;gap:30px;justify-items:start}
.foot h3{font-size:clamp(44px,7vw,96px);font-weight:800;letter-spacing:-.06em;line-height:.92}
.foot h3 i{font-style:normal;color:#3a3935}
.end{display:flex;justify-content:space-between;padding:26px clamp(16px,4vw,48px);border-top:1px solid #1c1b19;font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--mute)}
@media (max-width:640px){.cap{grid-template-columns:1fr}.stage{border-radius:14px}.hz{bottom:14vh}}
</style></head><body>
<div class="top"><b>GIGAPROP<i>.</i></b><span>for Vest</span></div>
<section class="hero"><div class="moon"></div><div class="hz"></div>
  <h1>GP.<br>Entry<i>.</i></h1>
  <div class="sub"><span><b>Risk</b> locked</span><span><b>One</b> click</span><span><b>Trim</b> · add · close</span><span><b>Desk</b> · copy · zone</span></div>
  <div class="cta"><a class="btn" href="https://raw.githubusercontent.com/deciphe/gp-pulse/main/gp-pulse.user.js">Install ↓</a><small>needs <a href="https://www.tampermonkey.net/" rel="noopener">Tampermonkey</a> · next.vestmarkets.com</small></div>
  <div class="scroll">SCROLL</div>
</section>
<section class="show" id="show">
  <div class="stage" id="stage"></div>
  <div class="cap"><div><h2 id="h"></h2><p id="p"></p></div><div class="nav"><button id="pv" aria-label="Previous">←</button><span id="n"></span><button id="nx" aria-label="Next">→</button></div></div>
  <div class="bar" id="bar"></div>
</section>
<section class="foot"><h3>Trade the plan<i>.</i><br>Nothing else<i>.</i></h3><a class="btn" href="https://raw.githubusercontent.com/deciphe/gp-pulse/main/gp-pulse.user.js">Install GP. Entry ↓</a></section>
<div class="end"><span>GIGAPROP.XYZ</span><span>NOT AFFILIATED WITH VEST</span></div>
<script>
const S = [
 ['risk', 'Risk<em>.</em>', 'stop set in dollars · fees inside'],
 ['target', 'Pass<em>.</em>', 'one tap to the pass level'],
 ['size', 'Size<em>.</em>', 'margin · max leverage'],
 ['click', 'One click<em>.</em>', 'long · short · alt+b · alt+s'],
 ['drag', 'Drag<em>.</em>', 'tp · sl · on the chart'],
 ['trim', 'Trim<em>.</em>', 'bank it · 25 · 50 · limits'],
 ['add', 'Add<em>.</em>', 'size in on the move'],
 ['desk', 'Desk<em>.</em>', 'every account · dll · mll'],
 ['switch', 'Switch<em>.</em>', 'one click to any account'],
 ['copy', 'Copy<em>.</em>', 'lead · followers · vest to vest'],
 ['zone', 'Zone<em>.</em>', 'set the stop · locked till reset'],
 ['pulse', 'Pulse<em>.</em>', 'spend · payouts · live pnl'],
 ['cert', 'Proof<em>.</em>', 'every zone · a certificate'],
 ['colours', 'Yours<em>.</em>', 'chart colours · saved sets']];
const T = 4200, st = document.getElementById('stage'), bar = document.getElementById('bar'), sh = document.getElementById('show');
document.documentElement.style.setProperty('--t', T + 'ms');
S.forEach(([f], i) => { const im = new Image(); im.src = 's/' + f + '.jpg'; im.alt = f; im.decoding = 'async'; if (i > 1) im.loading = 'lazy'; st.appendChild(im); const b = document.createElement('i'); b.innerHTML = '<b></b>'; b.onclick = () => go(i); bar.appendChild(b); });
let k = 0, tm = 0, seen = false;
function go(i) { k = (i + S.length) % S.length; [...st.children].forEach((e, j) => e.classList.toggle('on', j === k)); [...bar.children].forEach((e, j) => { e.classList.remove('on'); void e.offsetWidth; e.classList.toggle('done', j < k); if (j === k) e.classList.add('on'); });
  document.getElementById('h').innerHTML = S[k][1]; document.getElementById('p').textContent = S[k][2]; document.getElementById('n').textContent = String(k + 1).padStart(2, '0') + ' / ' + S.length;
  clearTimeout(tm); if (seen && !sh.classList.contains('paused')) tm = setTimeout(() => go(k + 1), T); }
document.getElementById('pv').onclick = () => go(k - 1); document.getElementById('nx').onclick = () => go(k + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(k + 1); if (e.key === 'ArrowLeft') go(k - 1); });
st.onmouseenter = () => { sh.classList.add('paused'); clearTimeout(tm); }; st.onmouseleave = () => { sh.classList.remove('paused'); go(k); };
let x0 = null; st.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true }); st.addEventListener('touchend', e => { if (x0 == null) return; const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 40) go(k + (d < 0 ? 1 : -1)); x0 = null; });
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !seen) { seen = true; go(k); } }), { threshold: .3 }).observe(st);
go(0);
</script>
</body></html>
