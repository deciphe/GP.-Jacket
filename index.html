<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP. Entry for Vest</title>
<meta name="description" content="GP. Entry for Vest. Fixed risk, one click, every account.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Geist:wght@500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b;--cr:#e6e3dc;--ink2:#c3c0b9;--mute:#8a877f;--faint:#4f4d48;--line2:rgba(238,234,226,.14);
  --mint:#9fd7b2;--mint2:#bfe6cb;--rose:#e8988c;--rose2:#efb1a7;
  --disp:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --sans:"Geist","Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pad:clamp(20px,3.6vw,68px);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--cr);font:500 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--cr);color:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#moon{animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

.bar{position:fixed;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:center;z-index:3;font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.bar.t{top:clamp(22px,3.6vw,56px)}.bar.b{bottom:clamp(22px,3.6vw,56px)}
.bar .mk{font:700 22px/1 var(--disp);letter-spacing:-.05em;text-transform:none;color:var(--cr)}
.bar .mk i{font-style:normal;color:var(--faint)}
.bar .live{display:flex;align-items:center;gap:10px}
.bar .live i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);animation:br 3.6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6);opacity:.5}45%{transform:scale(1.05);opacity:1}}

/* ---------- left: the words and the buttons ---------- */
.hero{position:relative;z-index:2;height:100%;padding:0 var(--pad);display:flex;flex-direction:column;justify-content:center}
.word{margin-left:-.055em;font:700 clamp(100px,15vw,320px)/.78 var(--disp);letter-spacing:-.075em;white-space:nowrap}
.word i{font-style:normal;color:var(--faint)}
.line{margin-top:clamp(30px,4vw,80px);font:600 clamp(28px,3.1vw,60px)/.95 var(--disp);letter-spacing:-.055em}
.line span{color:var(--faint)}
.act{margin-top:clamp(28px,3.2vw,54px);display:flex;gap:10px;flex-wrap:wrap}
.btn{height:60px;display:inline-flex;align-items:center;gap:22px;padding:0 26px;border-radius:12px;font:600 16px var(--sans);letter-spacing:-.01em;transition:background .15s,border-color .15s,color .15s,transform .25s var(--ease),box-shadow .3s}
.btn .k{font:500 12px var(--mono);opacity:.5}
.btn.p{background:var(--cr);color:var(--bg)}
.btn.p:hover{background:#fff;transform:translateY(-2px);box-shadow:0 20px 60px -18px rgba(230,227,220,.45)}
.btn.s{border:1px solid var(--line2);color:var(--ink2);background:rgba(11,11,11,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn.s:hover{border-color:rgba(238,234,226,.36);color:var(--cr)}

/* ---------- the trade, drawn across the moon ---------- */
.art{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;animation:up 1.6s var(--ease) forwards .55s}
.pl{position:absolute;height:1px;transform-origin:left center}
.pl em{position:absolute;right:0;top:50%;transform:translateY(-50%);height:24px;padding:0 11px;border-radius:7px;font:600 11.5px/22px var(--mono);font-style:normal;white-space:nowrap;background:var(--bg);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pl.tp{background:linear-gradient(90deg,rgba(159,215,178,0),rgba(159,215,178,.7) 18%)}.pl.tp em{color:var(--mint2);border:1px solid rgba(159,215,178,.55)}
.pl.en{background:repeating-linear-gradient(90deg,rgba(230,227,220,.32) 0 6px,transparent 6px 12px)}.pl.en em{color:var(--ink2);border:1px solid rgba(230,227,220,.18)}
.pl.sl{background:linear-gradient(90deg,rgba(232,152,140,0),rgba(232,152,140,.8) 18%)}.pl.sl em{color:var(--rose2);border:1px solid rgba(232,152,140,.6);cursor:ns-resize}
.pl.sl:after{content:"";position:absolute;left:34%;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--rose2);box-shadow:0 0 0 4px rgba(232,152,140,.14),0 0 18px rgba(232,152,140,.6)}
.pd{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--cr);box-shadow:0 0 0 5px rgba(230,227,220,.08),0 0 26px rgba(230,227,220,.55)}
.pd:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(230,227,220,.4);animation:ring 3.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:0}35%{opacity:.7}100%{transform:scale(1.7);opacity:0}}
.note{position:absolute;font:600 10.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.note b{display:block;margin-bottom:10px;font:700 clamp(26px,2.3vw,44px)/.9 var(--disp);letter-spacing:-.055em;text-transform:none;color:var(--cr)}
.note b.up{color:var(--mint2)}
.note:before{content:"";position:absolute;left:0;top:-22px;width:1px;height:14px;background:rgba(238,234,226,.25)}
.note.r{text-align:right}.note.r:before{left:auto;right:0}
.in{opacity:0;transform:translateY(22px);animation:up 1.2s var(--ease) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.5s}
@keyframes up{to{opacity:1;transform:none}}

@media (max-width:1000px){
  .word{font-size:min(31vw,240px)}
  .line{font-size:min(9.5vw,56px);margin-top:min(8vw,56px)}
  .note{display:none}
}
@media (max-width:600px){
  .act{display:grid;grid-template-columns:1fr}.btn{justify-content:space-between}
  .bar.b span:nth-child(2){display:none}
  .pl em{font-size:10.5px;padding:0 8px}
}
@media (max-height:640px) and (min-width:1001px){.word{font-size:min(15vw,30vh)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="moon"></canvas><canvas id="fx"></canvas>
<div class="art" id="art" aria-hidden="true">
  <div class="pl tp" id="tp"><em id="tpt">TP  +$200.00</em></div>
  <div class="pl en" id="en"><em id="ent">long 1.9089 BTC · 25x</em></div>
  <div class="pl sl" id="sl"><em id="slt">SL  −$100.00 · 39.5 pts</em></div>
  <i class="pd" id="pd"></i>
  <div class="note" id="n1"><b>One desk</b>every account · one click</div>
  <div class="note r" id="n2"><b class="up">+$1,284</b>zone · the receipt</div>
</div>

<div class="bar t"><span class="mk">GP<i>.</i></span><span class="live"><i></i>for Vest</span></div>

<main class="hero">
    <h1 class="word in d1">Entry<i>.</i></h1>
    <p class="line in d2">Fixed risk. One click.<br><span>Every account.</span></p>
    <div class="act in d3">
      <a class="btn p" href="https://raw.githubusercontent.com/deciphe/gp-pulse/main/gp-pulse.user.js">Install GP. Entry<span class="k">v<span id="ver">1.9.2</span></span></a>
      <a class="btn s" href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Get Tampermonkey<span class="k">↗</span></a>
    </div>
</main>

<div class="bar b"><span>gigaprop.xyz</span><span>Free · updates itself</span><span>Code GIGA</span></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
fetch('https://raw.githubusercontent.com/deciphe/gp-pulse/main/gp-pulse.user.js', { cache: 'no-store' }).then(r => r.text()).then(t => { const m = t.match(/@version\s+([\d.]+)/); if (m) $('ver').textContent = m[1]; }).catch(() => {});

// halftone moon on a horizon, a faint reflection under it
function moon(x, cx, cy, R, step, hz, flip, a) {
  const u = R / 400;
  for (let yy = -R; yy <= R; yy += step) for (let xx = -R; xx <= R; xx += step) {
    if (Math.hypot(xx, yy) > R) continue;
    const lx = (xx + R * .34) / R, ly = (yy + R * .42) / R, lit = Math.max(0, 1 - Math.hypot(lx, ly) * .72);
    const cr = Math.sin(xx * .021 / u) * Math.cos(yy * .017 / u) * .18 + Math.sin((xx + yy) * .009 / u) * .12;
    const v = Math.max(0, Math.min(1, lit + cr * lit)), r = step * .42 * Math.pow(v, 1.1); if (r < .35) continue;
    const py = flip ? 2 * hz - (cy + yy) : cy + yy; if (!flip && py > hz - 2) continue; if (flip && py < hz + 2) continue;
    const fade = flip ? Math.max(0, 1 - (py - hz) / (R * .9)) * .22 : 1;
    x.fillStyle = `rgba(230,227,220,${(a * (.35 + .65 * v) * fade).toFixed(3)})`; x.beginPath(); x.arc(cx + xx, py, r, 0, 7); x.fill();
  }
}
function freeBand() { // phones: the space between the buttons and the footer
  const a = document.querySelector('.act').getBoundingClientRect(), f = document.querySelector('.bar.b').getBoundingClientRect(), t = a.bottom + 36, b = f.top - 22;
  return { t, b, h: Math.max(120, b - t) };
}
function draw() {
  const W = innerWidth, Ht = innerHeight, d = Math.min(2, devicePixelRatio || 1), wide = W > 1000;
  [$('moon'), $('fx')].forEach(c => { c.width = W * d; c.height = Ht * d; });
  const m = $('moon').getContext('2d'); m.setTransform(d, 0, 0, d, 0, 0);
  const band = wide ? null : freeBand(), R = wide ? Math.min(W * .25, Ht * .42) : Math.min(W * .5, band.h * .95), hz = wide ? Ht * .76 : band.b, cx = wide ? W * .72 : W * .62, cy = hz - R * .42, st = Math.max(6, R / 52);
  moon(m, cx, cy, R, st, hz, false, wide ? .42 : .3); moon(m, cx, cy, R, st, hz, true, .4);
  const x = $('fx').getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(230,227,220,0)'); g.addColorStop(.62, 'rgba(230,227,220,.26)'); g.addColorStop(1, 'rgba(230,227,220,0)');
  x.fillStyle = g; x.fillRect(0, hz - .5, W, 1);
  let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 220; i++) { x.fillStyle = 'rgba(230,227,220,' + (rnd() * .14).toFixed(3) + ')'; x.beginPath(); x.arc(rnd() * W, rnd() * hz, rnd() * 1.1 + .3, 0, 7); x.fill(); }
  const vg = x.createRadialGradient(W * .3, Ht * .5, Math.min(W, Ht) * .2, W * .45, Ht * .5, Math.max(W, Ht) * .9); vg.addColorStop(0, 'rgba(11,11,11,.5)'); vg.addColorStop(.5, 'rgba(11,11,11,0)'); vg.addColorStop(1, 'rgba(11,11,11,.8)');
  x.fillStyle = vg; x.fillRect(0, 0, W, Ht);
  return { cx, cy, R, hz };
}
// the trade across the moon: the stop drifts, the dollars at risk stay, the size follows
let G = null;
function place() {
  const W = innerWidth, Ht = innerHeight, wide = W > 1000, R = G.R, x0 = wide ? G.cx - R * 1.08 : W * .08, x1 = W - (wide ? Math.max(24, W * .036) : 18);
  const set = (id, y) => { const e = $(id); e.style.left = x0 + 'px'; e.style.width = (x1 - x0) + 'px'; e.style.top = y + 'px'; };
  if (wide) { G.yTP = G.cy - R * .62; G.yEN = G.cy - R * .2; G.ySL = G.cy + R * .1; G.drift = R * .32; }
  else { const b = freeBand(); G.yTP = b.t; G.yEN = b.t + b.h * .4; G.ySL = b.t + b.h * .58; G.drift = b.h * .36; }
  set('tp', G.yTP); set('en', G.yEN); set('sl', G.ySL);
  G.x0 = x0; G.x1 = x1;
  const n1 = $('n1'), n2 = $('n2');
  n1.style.left = (G.cx - R * .95) + 'px'; n1.style.top = (G.hz + 30) + 'px';
  n2.style.right = (W - x1) + 'px'; n2.style.top = (G.hz + 30) + 'px';
}
const PX = 64500, F = 2 * PX * 1e-4;
function frame(now) {
  if (G) {
    const k = RM ? 0 : (1 - Math.cos(now / 12000 * Math.PI * 2)) / 2, d = 39.5 + k * 70, q = 100 / (d + F);
    const y = G.ySL + k * G.drift; $('sl').style.top = y + 'px';
    $('slt').textContent = 'SL  −$100.00 · ' + d.toFixed(1) + ' pts';
    $('ent').textContent = 'long ' + q.toFixed(4) + ' BTC · 25x';
    const tpd = (200 + F * q) / q; $('tpt').textContent = 'TP  +$200.00 · ' + tpd.toFixed(1) + ' pts';
    // price rides between entry and target
    const p = RM ? .35 : (Math.sin(now / 5200) * .5 + .5) * .75, py = G.yEN + (G.yTP - G.yEN) * p, px = G.x0 + (G.x1 - G.x0) * .52;
    const pd = $('pd'); pd.style.left = px + 'px'; pd.style.top = py + 'px';
  }
  requestAnimationFrame(frame);
}
function redraw() { G = draw(); place(); }
let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(redraw, 120); }); redraw(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
