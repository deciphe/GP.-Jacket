<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sovereign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Geist:wght@500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0a0a0b;--line:rgba(238,235,229,.07);--line-2:rgba(238,235,229,.14);
  --ink:#eeebe5;--ink-2:#c3c0b9;--mute:#8a877f;--faint:#55534e;
  --up:#7fd1ae;--down:#e88f86;--accent:#8fd3c4;--pool:#a9a3d6;
  --disp:"Inter Tight","Inter Display","Inter",ui-sans-serif,system-ui,sans-serif;
  --sans:"Geist","Inter",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --mx:62vw;--my:40vh;--r:180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);color:var(--ink);font:500 13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
.lbl{font:600 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.up{color:var(--up)}.dn{color:var(--down)}
.rd{color:var(--faint);letter-spacing:.02em}

/* ---------- the terminal, underneath ---------- */
.term{position:fixed;inset:0;display:grid;grid-template-rows:44px 1fr 104px;grid-template-columns:1fr 300px;grid-template-areas:"top top" "chart map" "tape tape";pointer-events:none;user-select:none}
.tt{grid-area:top;display:flex;align-items:center;gap:24px;padding:0 20px 0 300px;border-bottom:1px solid var(--line);font:500 12px var(--mono)}
.tt span{display:flex;gap:8px}.tt em{font:600 10.5px var(--sans);letter-spacing:.14em;color:var(--mute);font-style:normal}
.chart{grid-area:chart;position:relative;overflow:hidden}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.legend{position:absolute;left:18px;top:14px;display:flex;gap:16px;align-items:baseline;font:500 11.5px var(--mono);color:var(--mute)}
.legend b{font:600 13px var(--sans);color:var(--ink)}
.map{grid-area:map;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mh{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.net{font:600 18px var(--mono)}
.lad{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.lr{display:grid;grid-template-columns:62px 1fr;height:24px;font:500 11.5px var(--mono)}
.lr .st{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:var(--mute)}
.lr .v{display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin:1px 10px 1px 0;border-radius:4px;transition:background .25s}
.lr .v i{font:600 9.5px var(--sans);letter-spacing:.12em;font-style:normal;color:rgba(10,10,11,.7)}
.lr .v b{font-weight:500;color:rgba(10,10,11,.55)}
.lr.px .st{color:var(--ink)}.lr.px .v{box-shadow:inset 0 0 0 1px var(--line-2)}
.tape{grid-area:tape;border-top:1px solid var(--line);position:relative;overflow:hidden}
.flow{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.pr{display:flex;align-items:center;gap:10px;padding:0 22px;height:40px;border-right:1px solid var(--line);font:500 11.5px var(--mono);color:var(--mute)}
.pr .sy{color:var(--ink);font-weight:600}
.pr .ty{font:600 9.5px var(--sans);letter-spacing:.14em}

/* ---------- the fog, with one lens cut through it ---------- */
.fog{position:fixed;inset:0;background:rgba(10,10,11,.42);
  -webkit-backdrop-filter:blur(9px) saturate(.4) brightness(.5);backdrop-filter:blur(9px) saturate(.4) brightness(.5);
  -webkit-mask:radial-gradient(circle var(--r) at var(--mx) var(--my),transparent 62%,#000 100%);mask:radial-gradient(circle var(--r) at var(--mx) var(--my),transparent 62%,#000 100%)}
.shade{position:fixed;inset:0;pointer-events:none;-webkit-mask:radial-gradient(circle var(--r) at var(--mx) var(--my),transparent 62%,#000 100%);mask:radial-gradient(circle var(--r) at var(--mx) var(--my),transparent 62%,#000 100%);background:
  linear-gradient(90deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,.6) 34%,rgba(10,10,11,0) 62%),
  linear-gradient(0deg,rgba(10,10,11,.96) 0%,rgba(10,10,11,.5) 30%,rgba(10,10,11,0) 55%)}
.ring{position:fixed;left:var(--mx);top:var(--my);width:calc(var(--r)*2*.82);height:calc(var(--r)*2*.82);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(238,235,229,.1);pointer-events:none}
.ring::before,.ring::after{content:"";position:absolute;background:rgba(238,235,229,.35)}
.ring::before{left:50%;top:-6px;width:1px;height:12px}
.ring::after{top:50%;right:-6px;width:12px;height:1px}
.ring span{position:absolute;left:calc(100% + 14px);top:calc(50% + 10px);font:500 10.5px var(--mono);color:var(--mute);white-space:nowrap}

/* ---------- the gate ---------- */
.gate{position:fixed;inset:0;padding:28px 40px 30px;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none}
.gate a,.gate .key{pointer-events:auto}
.bar{display:flex;align-items:center;gap:20px}
.mark{font:600 12px/1 var(--sans);letter-spacing:.32em}
.mark i{font-style:normal;color:var(--accent);letter-spacing:0}
.bar .r{margin-left:auto;display:flex;gap:20px;align-items:center}
.sim{padding:5px 8px;border:1px solid var(--line-2);border-radius:6px;white-space:nowrap}
.mid{align-self:center;max-width:560px;margin-top:-20px}
.boot{font:500 11.5px/1.9 var(--mono);color:var(--faint)}
.boot div{white-space:pre;opacity:0;transition:opacity .3s}
.boot div.on{opacity:1}
.boot .ok{color:var(--ink-2)}.boot .lk{color:var(--down)}
.state{margin-top:34px;display:flex;align-items:center;gap:10px}
.state b{width:7px;height:7px;border:1.5px solid var(--down);border-radius:2px}
.state .lbl:last-child{color:var(--down)}
.line{margin-top:16px;font:600 30px/1.1 var(--disp);letter-spacing:-.03em;color:var(--ink)}
.line span{color:var(--faint)}
.act{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;opacity:0;transform:translateY(6px);transition:opacity .7s cubic-bezier(.2,.9,.25,1),transform .7s cubic-bezier(.2,.9,.25,1)}
.act.on{opacity:1;transform:none}
.btn{height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;border-radius:10px;font:600 13px var(--sans);transition:background .12s,border-color .12s,color .12s}
.btn.p{background:var(--ink);color:var(--ground)}.btn.p:hover{background:#fff}
.btn.s{border:1px solid var(--line-2);color:var(--ink-2);background:rgba(10,10,11,.4)}.btn.s:hover{border-color:rgba(238,235,229,.32);color:var(--ink)}
.btn .k{font:500 11px var(--mono);opacity:.5}
.key{height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;border:1px dashed var(--line-2);border-radius:10px;cursor:pointer;user-select:none;transition:border-color .12s}
.key:hover{border-color:var(--accent)}
.key code{font:600 13px var(--mono);letter-spacing:.14em;color:var(--accent)}
.key span{color:var(--mute);font-size:12px}
.meta{margin-top:18px;display:flex;gap:18px;color:var(--faint);font-size:12px}
.meta b{font:600 12px var(--mono);color:var(--ink-2)}
.meta s{font:500 12px var(--mono)}
.meta a{pointer-events:auto}.meta a:hover{color:var(--ink)}
.big{justify-self:start;font:600 200px/.8 var(--disp);letter-spacing:-.055em;color:var(--ink);white-space:nowrap;margin-left:-.04em}
.big i{font-style:normal;color:var(--accent)}

@media (max-width:760px){
  :root{--r:96px}
  .term{grid-template-columns:1fr 0;grid-template-rows:44px 1fr 90px}.map{display:none}.tt{padding-left:16px}.tt span:nth-child(n+2){display:none}
  .gate{padding:20px 16px 22px}
  .bar .clock{display:none}
  .mid{align-self:end;margin:0 0 26px}
  .boot{font-size:10.5px}
  .line{font-size:24px}
  .act{display:grid;grid-template-columns:1fr}.btn{justify-content:space-between}
  .ring span{display:none}
  .meta a{display:none}
  .shade{background:linear-gradient(0deg,rgba(10,10,11,.97) 0%,rgba(10,10,11,.85) 50%,rgba(10,10,11,.2) 75%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="term" aria-hidden="true">
  <div class="tt"><span><em>NQ</em><b id="tNQ"></b><b id="cNQ"></b></span><span><em>ES</em><b id="tES"></b></span><span><em>NET GEX</em><b class="rd" id="tG"></b></span></div>
  <div class="chart"><canvas id="cv"></canvas><div class="legend"><b>NQ · 5m</b><span id="ohlc"></span></div></div>
  <div class="map"><div class="mh"><span class="lbl">Gamma map · all</span><span class="net rd" id="net"></span></div><div class="lad" id="lad"></div></div>
  <div class="tape"><div class="flow" id="flow"></div></div>
</div>

<div class="fog"></div>
<div class="shade"></div>
<div class="ring" id="ring"><span id="lensP"></span></div>

<div class="gate">
  <div class="bar">
    <div class="mark">SOVEREIG<span style="letter-spacing:0">N</span><i>.</i></div>
    <div class="r"><span class="lbl clock" id="clk"></span></div>
  </div>
  <div class="mid">
    <div class="boot" id="boot"></div>

      <a class="btn p" href="https://whop.com/the-sovereign-analyst/products/sovereign-analyst-pro/" target="_blank" rel="noopener">Start 3 days free<span class="k">↗</span></a>

  </div>
  <div class="big" id="big">SOVEREIGN<i>.</i></div>
</div>

<script>
(() => {
'use strict';
let seed = 7;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const nrm = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283 * v); };
const $ = id => document.getElementById(id), root = document.documentElement;
const MINUS = '−';
const fmtP = p => p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// redacted figures: the shape of a number, never the number
const BL = '█', red = s => s.replace(/[0-9]/g, () => (Math.random() < .12 ? String(Math.floor(Math.random() * 10)) : BL));

// ---------- levels (illustrative) ----------
const CALL = 25600, ZERO = 25400, PUT = 25150, POOL = 25310, STEP = 25;
const gex = (s, t) => 620 * Math.exp(-(((s - CALL) / 85) ** 2)) + 190 * Math.tanh((s - ZERO) / 110) - 470 * Math.exp(-(((s - PUT) / 75) ** 2))
  + 60 * Math.sin(s / 37 + t * .0004) * Math.exp(-(((s - ZERO) / 300) ** 2));

// ---------- price: tick random walk, clustered volatility, fat tails, soft walls ----------
const TICKS = 12, N = 110;
let p = 25455, reg = 1, tgt = 25455, bars = [], cur = null, sub = 0;
function tick() {
  if (rnd() < .02) tgt = ZERO + nrm() * 120;
  reg = Math.max(.4, Math.min(3, reg * Math.exp(nrm() * .22) + (1 - reg) * .05)); if (rnd() < .012) reg *= 1.9;
  const fat = rnd() < .04 ? 3 : 1;
  p += nrm() * fat * 3.1 * reg + (tgt - p) * .006;
  if (p > CALL) p -= (p - CALL) * (.25 + rnd() * .5);
  if (p < PUT) p += (PUT - p) * (.25 + rnd() * .5);
  p = Math.round(p * 4) / 4;
  if (!cur) cur = { o: p, h: p, l: p, c: p };
  cur.h = Math.max(cur.h, p); cur.l = Math.min(cur.l, p); cur.c = p;
  if (++sub >= TICKS) { bars.push(cur); if (bars.length > N) bars.shift(); cur = null; sub = 0; }
}
for (let i = 0; i < N * TICKS; i++) tick();
const open0 = bars[0].o, last = () => (cur || bars[bars.length - 1]).c;

// ---------- chart ----------
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0;
function size() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
new ResizeObserver(size).observe(cv); size();
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const C = { up: css('--up'), dn: css('--down'), ac: css('--accent'), pool: css('--pool'), ink: css('--ink'), faint: css('--faint') }, MONO = css('--mono'), SANS = css('--sans');
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const rr = (x, y, w, h, r) => { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); };
let redCache = {}, redAt = 0;
const R = (k, s) => redCache[k] || (redCache[k] = red(s));

function draw(t) {
  if (!W) return;
  if (t - redAt > 700) { redCache = {}; redAt = t; }
  cx.clearRect(0, 0, W, H);
  const AX = 74, top = 54, bot = H - 24, hi = CALL + 70, lo = PUT - 70, pw = W - AX, gap = W > 600 ? 170 : 40;
  const y = v => top + (hi - v) / (hi - lo) * (bot - top), all = cur ? bars.concat([cur]) : bars, cw = (pw - gap) / (N + 1);

  // halftone gamma field
  for (let r = 0, rows = Math.floor((bot - top) / 9); r <= rows; r++) {
    const yy = top + r * 9, s = hi - (yy - top) / (bot - top) * (hi - lo), g = gex(s, t), a = Math.min(1, Math.abs(g) / 620);
    if (a < .06) continue;
    cx.fillStyle = rgba(g > 0 ? C.up : C.dn, .07 + a * .2);
    for (let c = 0, cols = Math.floor(pw / 9); c < cols; c++) {
      const rad = a * 2.4 * (.35 + .65 * c / cols) * (.85 + .15 * Math.sin(c * .7 + r * 1.3 + t * .0012));
      if (rad < .35) continue; cx.beginPath(); cx.arc(c * 9 + 4.5, yy, rad, 0, 6.283); cx.fill();
    }
  }
  // grid
  cx.font = '500 11px ' + MONO; cx.textBaseline = 'middle'; cx.textAlign = 'left';
  for (let v = Math.ceil(lo / 50) * 50; v <= hi; v += 50) {
    if ([CALL, ZERO, POOL, PUT].some(L => Math.abs(y(L) - y(v)) < 14)) continue;
    cx.fillStyle = 'rgba(238,235,229,.035)'; cx.fillRect(0, Math.round(y(v)), pw, 1);
    cx.fillStyle = C.faint; cx.fillText(v.toLocaleString('en-US'), pw + 12, y(v));
  }
  // levels: the line shows, the number stays locked
  const lvl = (v, col, name, dash) => {
    const yy = Math.round(y(v)) + .5;
    cx.strokeStyle = rgba(col, .55); cx.lineWidth = 1; cx.setLineDash(dash); cx.beginPath(); cx.moveTo(0, yy); cx.lineTo(pw, yy); cx.stroke(); cx.setLineDash([]);
    const val = R(name, '+$' + Math.round(Math.abs(gex(v, 0))) + '.0M');
    cx.font = '600 9.5px ' + SANS; const lw = cx.measureText(name).width; cx.font = '500 11px ' + MONO; const vw = W < 600 ? 0 : cx.measureText(val).width;
    const bw = lw + vw + (vw ? 30 : 20), bx = pw - gap + 14;
    cx.fillStyle = 'rgba(10,10,11,.9)'; rr(bx, yy - 11, bw, 22, 5); cx.fill(); cx.strokeStyle = rgba(col, .4); rr(bx, yy - 11, bw, 22, 5); cx.stroke();
    cx.fillStyle = col; cx.font = '600 9.5px ' + SANS; cx.fillText(name, bx + 10, yy + .5);
    if (vw) { cx.fillStyle = C.faint; cx.font = '500 11px ' + MONO; cx.fillText(val, bx + 20 + lw, yy + .5); }
    cx.fillStyle = rgba(col, .7); cx.font = '500 11px ' + MONO; cx.fillText(R(name + 'p', v.toLocaleString('en-US')), pw + 12, yy);
  };
  lvl(CALL, C.up, 'CALL WALL', [5, 4]); lvl(ZERO, C.ac, 'ZERO γ', [2, 4]); lvl(POOL, C.pool, 'DARK POOL', [1, 3]); lvl(PUT, C.dn, 'PUT WALL', [5, 4]);
  // candles
  const body = Math.max(2, cw * .62);
  all.forEach((b, i) => {
    const x = Math.round((i + .5) * cw), u = b.c >= b.o;
    cx.fillStyle = u ? 'rgba(238,235,229,.55)' : '#5d5b57'; cx.fillRect(x, Math.round(y(b.h)), 1, Math.max(1, Math.round(y(b.l) - y(b.h))));
    const y0 = y(Math.max(b.o, b.c)), y1 = y(Math.min(b.o, b.c)), bx = Math.round(x - body / 2 + .5), bh = Math.max(1, Math.round(y1 - y0));
    cx.fillStyle = u ? C.ink : '#2a2927'; cx.fillRect(bx, Math.round(y0), Math.round(body), bh);
    if (!u && bh > 2) { cx.strokeStyle = '#5d5b57'; cx.strokeRect(bx + .5, Math.round(y0) + .5, Math.round(body) - 1, bh - 1); }
  });
  const L = last(), ly = Math.round(y(L)) + .5, lx = Math.round((all.length - .5) * cw);
  cx.strokeStyle = 'rgba(238,235,229,.28)'; cx.setLineDash([1, 3]); cx.beginPath(); cx.moveTo(lx + 6, ly); cx.lineTo(pw, ly); cx.stroke(); cx.setLineDash([]);
  cx.fillStyle = C.ink; rr(pw + 4, ly - 10, AX - 8, 20, 4); cx.fill();
  cx.fillStyle = '#0a0a0b'; cx.font = '600 11px ' + MONO; cx.fillText(fmtP(L), pw + 10, ly + .5);
  const lb = all[all.length - 1];
  $('ohlc').textContent = `O ${fmtP(lb.o)}  H ${fmtP(lb.h)}  L ${fmtP(lb.l)}  C ${fmtP(lb.c)}`;
}

// ---------- gamma ladder: heat shows the shape, values stay locked ----------
const lad = $('lad'), ROWS = 27, rows = [];
for (let i = 0; i < ROWS; i++) { const d = document.createElement('div'); d.className = 'lr'; d.innerHTML = '<span class="st"></span><span class="v"><i></i><b></b></span>'; lad.appendChild(d); rows.push(d); }
function ladder(t) {
  const mid = Math.round(last() / STEP) * STEP, h = Math.floor(ROWS / 2);
  rows.forEach((row, i) => {
    const s = mid + (h - i) * STEP, g = gex(s, t), a = Math.pow(Math.min(1, Math.abs(g) / 620), .75), v = row.children[1];
    row.children[0].textContent = s.toLocaleString('en-US'); row.classList.toggle('px', s === mid);
    v.style.background = a < .04 ? 'transparent' : rgba(g > 0 ? C.up : C.dn, (.04 + .8 * a).toFixed(3));
    v.children[0].textContent = s === CALL ? 'CALL WALL' : s === PUT ? 'PUT WALL' : s === ZERO ? 'ZERO γ' : '';
    v.children[1].textContent = red((g < 0 ? MINUS : '+') + '$' + Math.abs(g).toFixed(1) + 'M');
    v.children[1].style.color = a > .3 ? 'rgba(10,10,11,.55)' : 'var(--faint)';
  });
  $('net').textContent = red('+$102.4M'); $('tG').textContent = red('+$102.4M');
}
function topbar() {
  const L = last(), ch = (L - open0) / open0 * 100;
  $('tNQ').textContent = fmtP(L); $('cNQ').textContent = (ch >= 0 ? '+' : MINUS) + Math.abs(ch).toFixed(2) + '%'; $('cNQ').className = ch >= 0 ? 'up' : 'dn';
  $('tES').textContent = fmtP(Math.round(6842.5 * (1 + ch / 100 * .82) * 4) / 4);
  const f = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
  $('clk').textContent = f.replace(/^24/, '00') + ' ET';
}

// ---------- flow tape: sides show, size stays locked ----------
const flow = $('flow'), TYPES = ['SWEEP', 'BLOCK', 'SPLIT', 'SWEEP'], EXP = ['0DTE', '0DTE', '1DTE', 'WEEK', 'MONTH'];
let off = 0;
function print() {
  const call = rnd() < .52, strike = Math.round((last() + (call ? 1 : -1) * Math.abs(nrm()) * 120) / 25) * 25, prem = Math.exp(nrm() * .9) * .6;
  const el = document.createElement('div'); el.className = 'pr';
  el.innerHTML = `<span class="sy">NQ</span><span>${strike.toLocaleString('en-US')}<span class="${call ? 'up' : 'dn'}">${call ? 'C' : 'P'}</span></span><span>${EXP[Math.floor(rnd() * 5)]}</span><span class="ty">${TYPES[Math.floor(rnd() * 4)]}</span><span class="rd">${red('$' + prem.toFixed(1) + 'M')}</span><span class="ty">${rnd() < .58 ? 'SOLD' : 'BOUGHT'}</span>`;
  flow.appendChild(el);
}
for (let i = 0; i < 16; i++) print();

// ---------- the lens ----------
let lens = { x: innerWidth * .62, y: innerHeight * .4 }, aim = null, idle = 0;
addEventListener('pointermove', e => { aim = { x: e.clientX, y: e.clientY }; idle = performance.now(); });
addEventListener('pointerleave', () => aim = null);
function lensAt(t) {
  const W2 = innerWidth, H2 = innerHeight, auto = !aim || t - idle > 2600;
  const tx = auto ? W2 * (W2 < 760 ? .5 + .2 * Math.sin(t * .00021) : .66 + .16 * Math.sin(t * .00021)) : aim.x, ty = auto ? H2 * (W2 < 760 ? .23 + .04 * Math.sin(t * .00033 + 1.2) : .36 + .14 * Math.sin(t * .00033 + 1.2)) : aim.y;
  lens.x += (tx - lens.x) * (auto ? .02 : .16); lens.y += (ty - lens.y) * (auto ? .02 : .16);
  root.style.setProperty('--mx', lens.x.toFixed(1) + 'px'); root.style.setProperty('--my', lens.y.toFixed(1) + 'px');
  // what the lens sits on
  const r = cv.getBoundingClientRect();
  if (lens.y > r.top + 54 && lens.y < r.bottom - 24 && lens.x < r.right - 74) {
    const v = CALL + 70 - (lens.y - r.top - 54) / (r.height - 78) * (CALL - PUT + 140);
    $('lensP').textContent = fmtP(Math.round(v * 4) / 4) + '  GEX ' + red('+$000.0M');
  } else $('lensP').textContent = '';
}

// ---------- boot ----------
const LOG = [['sovereign / terminal 3.0', '', ''], ['handshake ............ ', 'ok', 'ok'], ['gamma engines ........ ', 'ok', '5 / 5'], ['expiries ............. ', 'ok', '0DTE → monthly'], ['dark pool ............ ', 'ok', 'linked'], ['session key .......... ', 'lk', 'required']];
LOG.forEach((l, i) => { const d = document.createElement('div'); d.innerHTML = `&gt; ${l[0]}<span class="${l[1]}">${l[2]}</span>`; $('boot').appendChild(d); setTimeout(() => d.classList.add('on'), 200 + i * 180); });
setTimeout(() => $('act').classList.add('on'), 200 + LOG.length * 180 + 100);
$('key').onclick = () => { try { navigator.clipboard.writeText('SAPRO50'); } catch (e) {} $('keyS').textContent = 'Copied'; setTimeout(() => $('keyS').textContent = '50% off month one', 1400); };

// the wordmark fills the width
const big = $('big');
function fit() { big.style.fontSize = '100px'; const w = big.getBoundingClientRect().width, avail = innerWidth - (innerWidth > 760 ? 80 : 32); big.style.fontSize = Math.min(260, 100 * avail / w).toFixed(1) + 'px'; }
addEventListener('resize', fit); fit(); document.fonts && document.fonts.ready.then(fit);

// ---------- loop ----------
let lt = 0, lw = 0, lp = 0, lastT = performance.now();
function loop(t) {
  const dt = Math.min(64, t - lastT); lastT = t;
  if (t - lt > 260) { tick(); lt = t; }
  if (t - lw > 900) { ladder(t); topbar(); lw = t; }
  if (t - lp > 1700 + rnd() * 1200) { print(); lp = t; }
  off -= dt * .03; const f = flow.firstElementChild;
  if (f && -off > f.offsetWidth) { off += f.offsetWidth; f.remove(); }
  flow.style.transform = `translateX(${off.toFixed(1)}px)`;
  lensAt(t); draw(t); requestAnimationFrame(loop);
}
ladder(0); topbar(); requestAnimationFrame(loop);
})();
